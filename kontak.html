<!-- FORM -->
<div class="contact-container">
  <h1>Kontak Saya</h1>

<form onsubmit="kirimWA(); return false;">
  <input type="text" id="nama" placeholder="Nama" required>
  <input type="email" id="email" placeholder="Email" required>
  <textarea id="pesan" placeholder="Pesan" rows="5" required></textarea>
  <button type="submit">Kirim ke WhatsApp</button>
</form>
</div>

<script>
function kirimWA() {
  var nama = document.getElementById("nama").value;
  var email = document.getElementById("email").value;
  var pesan = document.getElementById("pesan").value;

  var nomor = "6287742995239"; // ganti dengan nomor kamu

  var text = "Halo, saya " + nama + "%0AEmail: " + email + "%0APesan: " + pesan;

  var url = "https://wa.me/" + nomor + "?text=" + text;

  window.open(url, "_blank");
}
</script>
