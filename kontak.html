<!-- FORM -->
<div class="contact-container">
  <h1>Kontak Saya</h1>
  
<form action="https://formspree.io/f/mgopjzrq" method="POST">
  <input type="text" name="nama" placeholder="Nama" required>
  <input type="email" name="email" placeholder="Email" required>
  <textarea name="pesan" placeholder="Pesan" rows="5" required></textarea>
  <button type="submit">Kirim</button>
  
  <input type="hidden" name="_next" value="https://yourusername.github.io/thanks.html">
</form>

</div>

<script>
function kirimWA() {
  var nama = document.getElementById("nama").value;
  var email = document.getElementById("email").value;
  var pesan = document.getElementById("pesan").value;

  var nomor = "6287742995239"; // ganti dengan nomor kamu

  var text = "Halo, saya " + nama + "%0AEmail: " + email + "%0APesan: " + pesan;

  var url = "https://wa.me/" + nomor + "?text=" + text;

  window.open(url, "_blank");
}
</script>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");

  // simpan ke localStorage
  if (document.body.classList.contains("dark")) {
    localStorage.setItem("mode", "dark");
  } else {
    localStorage.setItem("mode", "light");
  }
}

// cek saat pertama dibuka
if (localStorage.getItem("mode") === "dark") {
  document.body.classList.add("dark");
}
</script>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");

  let icon = document.getElementById("darkIcon");

  if (document.body.classList.contains("dark")) {
    localStorage.setItem("mode", "dark");
    icon.innerHTML = "☀️";
  } else {
    localStorage.setItem("mode", "light");
    icon.innerHTML = "🌙";
  }
}

if (localStorage.getItem("mode") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("darkIcon").innerHTML = "☀️";
}
</script>
